<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>bdeytv-live — Premium Live TV</title>
  <link rel="icon" type="image/png" href="logo.png">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7/dist/hls.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090c15;
      --card-bg: rgba(18, 24, 40, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent: #00f2fe;
      --accent-glow: rgba(0, 242, 254, 0.35);
      --text: #f8fafc;
      --muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      background-image: radial-gradient(circle at 15% 15%, rgba(0, 242, 254, 0.06), transparent 30%),
                        radial-gradient(circle at 85% 85%, rgba(79, 70, 229, 0.08), transparent 30%);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 0.85rem 2rem;
      border-bottom: 1px solid var(--card-border);
      background: rgba(9, 12, 21, 0.9);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      text-decoration: none;
      color: inherit;
    }

    .brand img {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      object-fit: cover;
      border: 1px solid var(--card-border);
      background: #111;
    }

    .brand-title {
      font-size: 1.35rem;
      font-weight: 800;
      background: linear-gradient(135deg, #fff, var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }

    /* Top Main Player Section */
    .player-anchor {
      width: 100%;
      max-width: 1100px;
      margin: 1.5rem auto 0.5rem auto;
      padding: 0 1.5rem;
      min-height: 480px;
    }

    .player-box {
      width: 100%;
      height: 480px;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--card-border);
      position: relative;
      box-shadow: 0 15px 35px rgba(0,0,0,0.6);
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Scroll-down to Miniplayer State */
    .player-box.mini {
      position: fixed;
      bottom: 25px;
      right: 25px;
      width: 380px;
      height: 220px;
      z-index: 999;
      border-radius: 12px;
      border: 1px solid var(--accent);
      box-shadow: 0 15px 40px rgba(0,0,0,0.85), 0 0 20px var(--accent-glow);
    }

    .video-container {
      width: 100%;
      height: 100%;
      position: relative;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    .player-header-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: 10px 15px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.85), transparent);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .player-controls-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 10px 15px;
      background: linear-gradient(to top, rgba(0,0,0,0.85), transparent);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .ctrl-btn {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      backdrop-filter: blur(4px);
    }

    .ctrl-btn:hover { background: var(--accent); color: #000; }

    .close-btn {
      background: rgba(255,255,255,0.2);
      border: none;
      color: #fff;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      font-size: 1.1rem;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .player-box.mini .close-btn { display: flex; }

    /* Filters */
    .filter-panel {
      padding: 1rem 2rem;
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: center;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }

    .search-box {
      flex: 1 1 240px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 0.7rem 1rem 0.7rem 2.5rem;
      border-radius: 10px;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
    }

    .search-box input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 10px var(--accent-glow);
    }

    .search-box svg {
      position: absolute;
      left: 0.85rem;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      fill: var(--muted);
    }

    .select-dropdown {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 0.7rem 1rem;
      border-radius: 10px;
      font-size: 0.85rem;
      cursor: pointer;
      outline: none;
    }

    /* 5x20 Grid */
    .catalog-wrapper {
      padding: 1rem 2rem;
      flex: 1;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 1.2rem;
    }

    @media (max-width: 1200px) { .grid-container { grid-template-columns: repeat(4, 1fr); } }
    @media (max-width: 900px) { 
      .grid-container { grid-template-columns: repeat(3, 1fr); }
      .player-anchor { min-height: 320px; }
      .player-box { height: 320px; }
    }
    @media (max-width: 650px) { .grid-container { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 420px) { .grid-container { grid-template-columns: 1fr; } }

    .channel-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 1.1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      cursor: pointer;
      position: relative;
      transition: all 0.25s ease;
    }

    .channel-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
      box-shadow: 0 10px 25px rgba(0, 242, 254, 0.15);
    }

    .channel-card.active-card {
      border-color: var(--accent);
      background: rgba(0, 242, 254, 0.08);
      box-shadow: 0 0 15px var(--accent-glow);
    }

    .logo-box {
      width: 100%;
      height: 85px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.3);
      border-radius: 10px;
      margin-bottom: 0.85rem;
      overflow: hidden;
      padding: 0.5rem;
    }

    .logo-box img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .channel-name {
      font-size: 0.95rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
      margin-bottom: 0.4rem;
    }

    .badge-row {
      display: flex;
      gap: 0.35rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .badge {
      font-size: 0.65rem;
      padding: 2px 7px;
      border-radius: 20px;
      background: rgba(255,255,255,0.06);
      color: var(--muted);
      text-transform: uppercase;
      font-weight: 600;
    }

    /* Pagination */
    .pagination-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
      padding: 2.5rem 1rem;
    }

    .pg-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 0.5rem 0.9rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    .pg-btn.active {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
    }
  </style>
</head>
<body>

  <header>
    <a href="#" class="brand">
      <img src="logo.png" onerror="this.src='logo.png'" alt="logo">
      <div class="brand-title">bdeytv-live</div>
    </a>
    <div id="stat-counter" style="font-size: 0.8rem; color: var(--muted);">Loading channels...</div>
  </header>

  <!-- Player Anchor (Keeps layout space when minimized) -->
  <div class="player-anchor" id="playerAnchor">
    <div class="player-box" id="mainPlayerBox">
      <div class="video-container">
        <div class="player-header-bar">
          <span id="playingTitle">Select a channel to play</span>
          <button class="close-btn" onclick="closePlayer()" title="Close Player">&times;</button>
        </div>
        
        <video id="tvPlayer" playsinline muted></video>

        <div class="player-controls-bar">
          <button class="ctrl-btn" id="muteBtn" onclick="toggleMute()">🔇 Unmute</button>
          <button class="ctrl-btn" onclick="toggleFullScreen()">⛶ Fullscreen</button>
        </div>
      </div>
    </div>
  </div>

  <section class="filter-panel">
    <div class="search-box">
      <svg viewBox="0 0 24 24"><path d="M10 18a7.952 7.952 0 0 0 4.897-1.688l4.396 4.396 1.414-1.414-4.396-4.396A7.952 7.952 0 0 0 18 10c0-4.411-3.589-8-8-8s-8 3.589-8 8 3.589 8 8 8zm0-14c3.309 0 6 2.691 6 6s-2.691 6-6 6-6-2.691-6-6 2.691-6 6-6z"/></svg>
      <input type="text" id="searchInput" placeholder="Search channels...">
    </div>
    <select id="countryFilter" class="select-dropdown"><option value="">All Countries</option></select>
    <select id="langFilter" class="select-dropdown"><option value="">All Languages</option></select>
    <select id="catFilter" class="select-dropdown"><option value="">All Genres</option></select>
  </section>

  <main class="catalog-wrapper">
    <div id="channelGrid" class="grid-container"></div>
    <div id="pagination" class="pagination-bar"></div>
  </main>

  <script>
    const ITEMS_PER_PAGE = 100; // 5x20 Grid
    let allChannels = [];
    let filteredChannels = [];
    let currentPage = 1;
    let hls = null;
    let activeChannel = null;

    async function init() {
      try {
        const res = await fetch('channels.json?t=' + Date.now());
        if (res.ok) {
          allChannels = await res.json();
        } else {
          throw new Error('channels.json not found');
        }
      } catch (e) {
        // Fallback test working streams
        allChannels = [
          { title: "Red Bull TV (Live 24/7)", logo: "logo.png", country: "US", language: "English", category: "Sports", url: "https://rbmn-live.akamaized.net/hls/live/590964/FLN_PB_AND/master.m3u8" },
          { title: "NASA TV HD", logo: "logo.png", country: "US", language: "English", category: "Science", url: "https://ntv1.akamaized.net/hls/live/2014075/NASA-NTV1-HLS/master.m3u8" }
        ];
      }

      document.getElementById('stat-counter').innerText = `${allChannels.length} Channels`;
      populateFilters();
      applyFilters();

      // Automatically play the 1st channel by default (muted)
      if (allChannels.length > 0) {
        playStream(allChannels[0]);
      }
    }

    function populateFilters() {
      const countries = new Set(), langs = new Set(), cats = new Set();
      allChannels.forEach(c => {
        if (c.country) countries.add(c.country);
        if (c.language) langs.add(c.language);
        if (c.category) cats.add(c.category);
      });

      const fill = (id, set) => {
        const el = document.getElementById(id);
        Array.from(set).sort().forEach(item => {
          const opt = document.createElement('option');
          opt.value = item;
          opt.innerText = item;
          el.appendChild(opt);
        });
      };
      fill('countryFilter', countries);
      fill('langFilter', langs);
      fill('catFilter', cats);
    }

    function applyFilters() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const country = document.getElementById('countryFilter').value;
      const lang = document.getElementById('langFilter').value;
      const cat = document.getElementById('catFilter').value;

      filteredChannels = allChannels.filter(c => {
        const matchQ = !q || (c.title && c.title.toLowerCase().includes(q));
        const matchCountry = !country || c.country === country;
        const matchLang = !lang || c.language === lang;
        const matchCat = !cat || c.category === cat;
        return matchQ && matchCountry && matchLang && matchCat;
      });

      currentPage = 1;
      renderGrid();
    }

    function renderGrid() {
      const grid = document.getElementById('channelGrid');
      grid.innerHTML = "";

      const start = (currentPage - 1) * ITEMS_PER_PAGE;
      const paged = filteredChannels.slice(start, start + ITEMS_PER_PAGE);

      paged.forEach(ch => {
        const card = document.createElement('div');
        card.className = `channel-card ${activeChannel && ch.url === activeChannel.url ? 'active-card' : ''}`;
        card.onclick = () => playStream(ch);

        card.innerHTML = `
          <div class="logo-box">
            <img src="${ch.logo || 'logo.png'}" onerror="this.src='logo.png'" alt="${ch.title}">
          </div>
          <div class="channel-name" title="${ch.title}">${ch.title}</div>
          <div class="badge-row">
            <span class="badge">${ch.country || 'TV'}</span>
            <span class="badge">${ch.category || 'General'}</span>
          </div>
        `;
        grid.appendChild(card);
      });

      renderPagination();
    }

    function renderPagination() {
      const container = document.getElementById('pagination');
      container.innerHTML = "";
      const totalPages = Math.ceil(filteredChannels.length / ITEMS_PER_PAGE);
      if (totalPages <= 1) return;

      const createBtn = (text, page, active = false) => {
        const btn = document.createElement('button');
        btn.className = `pg-btn ${active ? 'active' : ''}`;
        btn.innerText = text;
        btn.onclick = () => {
          currentPage = page;
          renderGrid();
          window.scrollTo({ top: 400, behavior: 'smooth' });
        };
        return btn;
      };

      if (currentPage > 1) container.appendChild(createBtn('« Prev', currentPage - 1));
      
      const maxButtons = 5;
      let startP = Math.max(1, currentPage - 2);
      let endP = Math.min(totalPages, startP + maxButtons - 1);

      for (let i = startP; i <= endP; i++) {
        container.appendChild(createBtn(i, i, i === currentPage));
      }

      if (currentPage < totalPages) container.appendChild(createBtn('Next »', currentPage + 1));
    }

    function playStream(ch, useProxy = false) {
      activeChannel = ch;
      const video = document.getElementById('tvPlayer');
      const title = document.getElementById('playingTitle');
      title.innerText = ch.title;
      renderGrid();

      video.muted = true;
      document.getElementById('muteBtn').innerText = "🔇 Unmute";

      let streamUrl = ch.url;
      if (useProxy) {
        streamUrl = `https://corsproxy.io/?url=${encodeURIComponent(ch.url)}`;
      }

      if (hls) {
        hls.destroy();
      }

      if (Hls.isSupported()) {
        hls = new Hls({ enableWorker: true, lowLatencyMode: true });
        hls.loadSource(streamUrl);
        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          video.play().catch(() => {});
        });

        hls.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal && !useProxy) {
            playStream(ch, true);
          }
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = streamUrl;
        video.play().catch(() => {});
      }
    }

    function toggleMute() {
      const video = document.getElementById('tvPlayer');
      video.muted = !video.muted;
      document.getElementById('muteBtn').innerText = video.muted ? "🔇 Unmute" : "🔊 Mute";
    }

    function toggleFullScreen() {
      const video = document.getElementById('tvPlayer');
      if (!document.fullscreenElement) {
        if (video.requestFullscreen) video.requestFullscreen();
        else if (video.webkitRequestFullscreen) video.webkitRequestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }

    function closePlayer() {
      const playerBox = document.getElementById('mainPlayerBox');
      playerBox.classList.remove('mini');
      const video = document.getElementById('tvPlayer');
      if (hls) {
        hls.destroy();
        hls = null;
      }
      video.pause();
      video.src = "";
      document.getElementById('playingTitle').innerText = "Select a channel to play";
      activeChannel = null;
      renderGrid();
    }

    /* Scroll Listener: Scroll Down = Minimize, Scroll Up = Normal */
    window.addEventListener('scroll', () => {
      const anchor = document.getElementById('playerAnchor');
      const playerBox = document.getElementById('mainPlayerBox');
      const rect = anchor.getBoundingClientRect();

      // প্লেয়ার এলাকা পার হয়ে নিচে স্ক্রোল করলেই মিনিপ্লেয়ার হবে
      if (rect.bottom < 100 && activeChannel) {
        playerBox.classList.add('mini');
      } else {
        playerBox.classList.remove('mini');
      }
    });

    document.getElementById('searchInput').addEventListener('input', applyFilters);
    document.getElementById('countryFilter').addEventListener('change', applyFilters);
    document.getElementById('langFilter').addEventListener('change', applyFilters
