<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>bdeytv-live — Premium Live TV</title>
  <link rel="icon" type="image/png" href="logo.png">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7/dist/hls.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090c15;
      --card-bg: rgba(18, 24, 40, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent: #00f2fe;
      --accent-glow: rgba(0, 242, 254, 0.35);
      --text: #f8fafc;
      --muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background-color: var(--bg);
      background-image: radial-gradient(circle at 15% 15%, rgba(0, 242, 254, 0.06), transparent 30%),
                        radial-gradient(circle at 85% 85%, rgba(79, 70, 229, 0.08), transparent 30%);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    header {
      padding: 0.65rem 1.2rem;
      border-bottom: 1px solid var(--card-border);
      background: rgba(9, 12, 21, 0.95);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      text-decoration: none;
      color: inherit;
    }

    .brand img {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      object-fit: cover;
      border: 1px solid var(--card-border);
      background: #111;
    }

    .brand-title {
      font-size: 1.15rem;
      font-weight: 800;
      background: linear-gradient(135deg, #fff, var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }

    /* Player Container */
    .player-anchor {
      width: 100%;
      max-width: 950px;
      margin: 0.75rem auto 0.25rem auto;
      padding: 0 0.8rem;
    }

    .player-aspect-keeper {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 Aspect Ratio */
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--card-border);
      box-shadow: 0 10px 25px rgba(0,0,0,0.7);
    }

    .player-box {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Desktop Miniplayer */
    .player-box.mini {
      position: fixed;
      top: auto;
      left: auto;
      bottom: 20px;
      right: 20px;
      width: 320px;
      height: 180px;
      z-index: 999;
      border-radius: 10px;
      border: 1px solid var(--accent);
      box-shadow: 0 12px 35px rgba(0,0,0,0.9), 0 0 15px var(--accent-glow);
    }

    /* Mobile Miniplayer */
    @media (max-width: 600px) {
      .player-box.mini {
        width: 200px;
        height: 112px;
        bottom: 12px;
        right: 12px;
      }
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    .error-overlay {
      position: absolute;
      inset: 0;
      background: rgba(9, 12, 21, 0.94);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 1rem;
      z-index: 25;
    }

    .error-overlay.active { display: flex; }

    .error-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: #ff6b6b;
      margin-bottom: 0.3rem;
    }

    .error-desc {
      font-size: 0.72rem;
      color: var(--muted);
      margin-bottom: 0.75rem;
      max-width: 280px;
    }

    .retry-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--accent);
      padding: 4px 10px;
      border-radius: 5px;
      font-size: 0.72rem;
      cursor: pointer;
      font-weight: 600;
    }

    .player-header-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: 6px 10px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.85), transparent);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .player-controls-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 6px 10px;
      background: linear-gradient(to top, rgba(0,0,0,0.85), transparent);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .ctrl-btn {
      background: rgba(255,255,255,0.18);
      border: 1px solid rgba(255,255,255,0.25);
      color: #fff;
      padding: 4px 8px;
      border-radius: 5px;
      font-size: 0.72rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      backdrop-filter: blur(4px);
    }

    .ctrl-btn:hover { background: var(--accent); color: #000; }

    .close-btn {
      background: rgba(255,255,255,0.25);
      border: none;
      color: #fff;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      font-size: 1rem;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .player-box.mini .close-btn { display: flex; }

    /* Compact Filter Panel (No Countries, No Languages) */
    .filter-panel {
      padding: 0.65rem 0.8rem;
      display: grid;
      grid-template-columns: 1fr 180px;
      gap: 0.5rem;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }

    @media (max-width: 500px) {
      .filter-panel {
        grid-template-columns: 1fr;
      }
    }

    .search-box {
      position: relative;
    }

    .search-box input {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 0.55rem 0.8rem 0.55rem 2.2rem;
      border-radius: 8px;
      color: #fff;
      font-size: 0.82rem;
      outline: none;
    }

    .search-box input:focus { border-color: var(--accent); }

    .search-box svg {
      position: absolute;
      left: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      width: 14px;
      height: 14px;
      fill: var(--muted);
    }

    .select-dropdown {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 0.55rem 0.75rem;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      outline: none;
      width: 100%;
    }

    /* Grid Layout: Desktop 5x20, Mobile Compact 2-column */
    .catalog-wrapper {
      padding: 0.5rem 0.8rem;
      flex: 1;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 0.75rem;
    }

    @media (max-width: 1200px) { .grid-container { grid-template-columns: repeat(4, 1fr); } }
    @media (max-width: 900px) { .grid-container { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 600px) { 
      .grid-container { 
        grid-template-columns: repeat(2, 1fr); 
        gap: 0.5rem;
      } 
    }

    .channel-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 0.65rem 0.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .channel-card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .channel-card.active-card {
      border-color: var(--accent);
      background: rgba(0, 242, 254, 0.08);
      box-shadow: 0 0 10px var(--accent-glow);
    }

    /* Small Logo with NO border and NO background box */
    .logo-box {
      width: 100%;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      margin-bottom: 0.4rem;
      padding: 0;
    }

    .logo-box img {
      max-width: 75px;
      max-height: 42px;
      object-fit: contain;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }

    .channel-name {
      font-size: 0.8rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
      margin-bottom: 0.2rem;
    }

    .badge-row {
      display: flex;
      gap: 0.25rem;
      justify-content: center;
    }

    .badge {
      font-size: 0.58rem;
      padding: 1px 5px;
      border-radius: 8px;
      background: rgba(255,255,255,0.06);
      color: var(--muted);
      text-transform: uppercase;
      font-weight: 600;
    }

    /* Pagination */
    .pagination-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.35rem;
      padding: 1.5rem 0.5rem;
      flex-wrap: wrap;
    }

    .pg-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 0.4rem 0.7rem;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
    }

    .pg-btn.active {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
    }
  </style>
</head>
<body>

  <header>
    <a href="#" class="brand">
      <img src="logo.png" onerror="this.src='logo.png'" alt="logo">
      <div class="brand-title">bdeytv-live</div>
    </a>
    <div id="stat-counter" style="font-size: 0.78rem; color: var(--muted); font-weight: 600;">Loading...</div>
  </header>

  <!-- Responsive 16:9 Main Player Frame -->
  <div class="player-anchor" id="playerAnchor">
    <div class="player-aspect-keeper">
      <div class="player-box" id="mainPlayerBox">
        <div class="player-header-bar">
          <span id="playingTitle" style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 80%;">Select Channel</span>
          <button class="close-btn" onclick="closePlayer()" title="Close">&times;</button>
        </div>
        
        <video id="tvPlayer" playsinline webkit-playsinline muted></video>

        <!-- Stream Error Overlay -->
        <div id="errorOverlay" class="error-overlay">
          <div class="error-title">⚠️ Stream Offline / Geo-Restricted</div>
          <div class="error-desc">Channel server offline or blocked. Select another channel.</div>
          <button class="retry-btn" onclick="retryStreamWithProxy()">Try Proxy Mirror</button>
        </div>

        <div class="player-controls-bar">
          <button class="ctrl-btn" id="muteBtn" onclick="toggleMute()">🔇 Unmute</button>
          <button class="ctrl-btn" onclick="toggleFullScreen()">⛶ Fullscreen</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Search & Single Genre Filter -->
  <section class="filter-panel">
    <div class="search-box">
      <svg viewBox="0 0 24 24"><path d="M10 18a7.952 7.952 0 0 0 4.897-1.688l4.396 4.396 1.414-1.414-4.396-4.396A7.952 7.952 0 0 0 18 10c0-4.411-3.589-8-8-8s-8 3.589-8 8 3.589 8 8 8zm0-14c3.309 0 6 2.691 6 6s-2.691 6-6 6-6-2.691-6-6 2.691-6 6-6z"/></svg>
      <input type="text" id="searchInput" placeholder="Search channels...">
    </div>
    <select id="catFilter" class="select-dropdown"><option value="">All Genres</option></select>
  </section>

  <main class="catalog-wrapper">
    <div id="channelGrid" class="grid-container"></div>
    <div id="pagination" class="pagination-bar"></div>
  </main>

  <script>
    const ITEMS_PER_PAGE = 100;
    let allChannels = [];
    let filteredChannels = [];
    let currentPage = 1;
    let hls = null;
    let activeChannel = null;

    async function init() {
      const statEl = document.getElementById('stat-counter');
      statEl.innerText = "Loading...";

      let dataLoaded = false;
      try {
        const res = await fetch('channels.json?nocache=' + Date.now());
        if (res.ok) {
          const json = await res.json();
          if (Array.isArray(json) && json.length > 0) {
            allChannels = json;
            dataLoaded = true;
          }
        }
      } catch (e) {}

      if (!dataLoaded) {
        try {
          statEl.innerText = "Syncing IPTV...";
          const m3uRes = await fetch('https://iptv-org.github.io/iptv/index.m3u');
          const text = await m3uRes.text();
          allChannels = parseM3U(text);
          dataLoaded = true;
        } catch (err) {}
      }

      if (!allChannels || allChannels.length === 0) {
        allChannels = [
          { title: "Red Bull TV", logo: "logo.png", category: "Sports", url: "https://rbmn-live.akamaized.net/hls/live/590964/FLN_PB_AND/master.m3u8" }
        ];
      }

      statEl.innerText = `${allChannels.length} Channels`;
      populateFilters();
      applyFilters();

      if (allChannels.length > 0) {
        playStream(allChannels[0]);
      }
    }

    function parseM3U(data) {
      const lines = data.split('\n');
      const list = [];
      let current = null;

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i].trim();
        if (line.startsWith('#EXTINF:')) {
          current = { title: "TV Channel", logo: "logo.png", category: "General" };
          const logoMatch = line.match(/tvg-logo="([^"]*)"/);
          if (logoMatch && logoMatch[1]) current.logo = logoMatch[1];

          const groupMatch = line.match(/group-title="([^"]*)"/);
          if (groupMatch && groupMatch[1]) current.category = groupMatch[1];

          const parts = line.split(',');
          if (parts.length > 1) current.title = parts[parts.length - 1].trim();
        } else if (line && !line.startsWith('#') && current) {
          if (line.startsWith('https://')) {
            current.url = line;
            list.push(current);
          }
          current = null;
        }
      }
      return list;
    }

    function populateFilters() {
      const cats = new Set();
      allChannels.forEach(c => {
        if (c.category) cats.add(c.category);
      });

      const el = document.getElementById('catFilter');
      el.innerHTML = '<option value="">All Genres</option>';
      Array.from(cats).sort().forEach(item => {
        const opt = document.createElement('option');
        opt.value = item;
        opt.innerText = item;
        el.appendChild(opt);
      });
    }

    function applyFilters() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const cat = document.getElementById('catFilter').value;

      filteredChannels = allChannels.filter(c => {
        const matchQ = !q || (c.title && c.title.toLowerCase().includes(q));
        const matchCat = !cat || c.category === cat;
        return matchQ && matchCat;
      });

      currentPage = 1;
      renderGrid();
    }

    function renderGrid() {
      const grid = document.getElementById('channelGrid');
      grid.innerHTML = "";

      const start = (currentPage - 1) * ITEMS_PER_PAGE;
      const paged = filteredChannels.slice(start, start + ITEMS_PER_PAGE);

      paged.forEach(ch => {
        const card = document.createElement('div');
        card.className = `channel-card ${activeChannel && ch.url === activeChannel.url ? 'active-card' : ''}`;
        card.onclick = () => {
          playStream(ch);
          window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        card.innerHTML = `
          <div class="logo-box">
            <img src="${ch.logo || 'logo.png'}" onerror="this.src='logo.png'" alt="${ch.title}">
          </div>
          <div class="channel-name" title="${ch.title}">${ch.title}</div>
          <div class="badge-row">
            <span class="badge">${ch.category || 'Live'}</span>
          </div>
        `;
        grid.appendChild(card);
      });

      renderPagination();
    }

    function renderPagination() {
      const container = document.getElementById('pagination');
      container.innerHTML = "";
      const totalPages = Math.ceil(filteredChannels.length / ITEMS_PER_PAGE);
      if (totalPages <= 1) return;

      const createBtn = (text, page, active = false) => {
        const btn = document.createElement('button');
        btn.className = `pg-btn ${active ? 'active' : ''}`;
        btn.innerText = text;
        btn.onclick = () => {
          currentPage = page;
          renderGrid();
          window.scrollTo({ top: 320, behavior: 'smooth' });
        };
        return btn;
      };

      if (currentPage > 1) container.appendChild(createBtn('«', currentPage - 1));
      let startP = Math.max(1, currentPage - 2);
      let endP = Math.min(totalPages, startP + 4);

      for (let i = startP; i <= endP; i++) {
        container.appendChild(createBtn(i, i, i === currentPage));
      }

      if (currentPage < totalPages) container.appendChild(createBtn('»', currentPage + 1));
    }

    function playStream(ch, useProxy = false) {
      activeChannel = ch;
      const video = document.getElementById('tvPlayer');
      const title = document.getElementById('playingTitle');
      const errOverlay = document.getElementById('errorOverlay');
      
      errOverlay.classList.remove('active');
      title.innerText = ch.title;
      renderGrid();

      video.muted = true;
      document.getElementById('muteBtn').innerText = "🔇 Unmute";

      let streamUrl = ch.url;
      if (useProxy) {
        streamUrl = `https://corsproxy.io/?url=${encodeURIComponent(ch.url)}`;
      }

      if (hls) {
        hls.destroy();
      }

      if (Hls.isSupported()) {
        hls = new Hls({ enableWorker: true, lowLatencyMode: true });
        hls.loadSource(streamUrl);
        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          video.play().catch(() => {});
        });

        hls.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) {
            if (!useProxy) {
              playStream(ch, true);
            } else {
              errOverlay.classList.add('active');
            }
          }
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = streamUrl;
        video.play().catch(() => {});
        video.onerror = () => {
          errOverlay.classList.add('active');
        };
      }
    }

    function retryStreamWithProxy() {
      if (activeChannel) playStream(activeChannel, true);
    }

    function toggleMute() {
      const video = document.getElementById('tvPlayer');
      video.muted = !video.muted;
      document.getElementById('muteBtn').innerText = video.muted ? "🔇 Unmute" : "🔊 Mute";
    }

    function toggleFullScreen() {
      const video = document.getElementById('tvPlayer');
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (video.requestFullscreen) video.requestFullscreen();
        else if (video.webkitRequestFullscreen) video.webkitRequestFullscreen();
        else if (video.webkitEnterFullscreen) video.webkitEnterFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      }
    }

    function closePlayer() {
      const playerBox = document.getElementById('mainPlayerBox');
      playerBox.classList.remove('mini');
      const video = document.getElementById('tvPlayer');
      if (hls) {
        hls.destroy();
        hls = null;
      }
      video.pause();
      video.src = "";
      document.getElementById('errorOverlay').classList.remove('active');
      document.getElementById('playingTitle').innerText = "Select Channel";
      activeChannel = null;
      renderGrid();
    }

    window.addEventListener('scroll', () => {
      const anchor = document.getElementById('playerAnchor');
      const playerBox = document.getElementById('mainPlayerBox');
      const rect = anchor.getBoundingClientRect();

      if (rect.bottom < 60 && activeChannel) {
        playerBox.classList.add('mini');
      } else {
        playerBox.classList.remove('mini');
      }
    }, { passive: true });

    document.getElementById('searchInput').addEventListener('input', applyFilters);
    document.getElementById('catFilter').addEventListener('change', applyFilters);

    window.onload = init;
  </script>
</body>
</html>
