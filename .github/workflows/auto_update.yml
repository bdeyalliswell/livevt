name: Auto Clean and Update IPTV

on:
  schedule:
    # প্রতিদিন রাত ১২টায় স্বয়ংক্রিয়ভাবে চলবে
    - cron: '0 0 * * *'
  # আপনার ইচ্ছামতো যেকোনো সময় ম্যানুয়ালি রান করার অপশন
  workflow_dispatch:

jobs:
  run-cleaner:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Requests Library
        run: pip install requests

      - name: Run Script
        run: python clean_m3u.py

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add active_playlist.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto updated active streams" && git push)
